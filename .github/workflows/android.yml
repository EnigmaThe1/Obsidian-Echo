name: Android Obsidian Echo - Build and Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-echo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Obsidian Echo customisation
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned upstream Echo source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/DaedalusApps/daedalus-echo.git upstream-echo
          cd upstream-echo
          git checkout --detach 6c308fabaf7c54734b5f769bfc5de569a05edcce
          test "$(git rev-parse HEAD)" = 6c308fabaf7c54734b5f769bfc5de569a05edcce

      - name: Apply isolated Obsidian integration and safety patches
        run: python3 scripts/patch_upstream.py upstream-echo

      - name: Verify the app is separately installable
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationIdSuffix = ".obsidian"' upstream-echo/android/app/build.gradle.kts
          grep -q 'android:allowBackup="false"' upstream-echo/android/app/src/main/AndroidManifest.xml
          grep -q 'class ObsidianImporter' upstream-echo/android/app/src/main/java/com/daedalusapps/echo/data/obsidian/ObsidianImporter.kt
          grep -q 'filterNot { it.filename.startsWith("obsidian_") }' upstream-echo/android/app/src/main/java/com/daedalusapps/echo/data/backup/BackupManager.kt

      - name: Run Android JVM unit tests
        working-directory: upstream-echo/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Publish JVM unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-jvm-test-results
          path: upstream-echo/android/app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build isolated debug APK
        working-directory: upstream-echo/android
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify Android package identifier and output
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find upstream-echo/android/app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)
          test -n "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.daedalusapps.echo.obsidian'"
          mkdir -p dist
          cp "$APK" dist/Obsidian-Echo-experimental-debug.apk
          (cd dist && sha256sum Obsidian-Echo-experimental-debug.apk > SHA256SUMS.txt)

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-echo-experimental-apk
          path: dist/
          retention-days: 14
          if-no-files-found: error
